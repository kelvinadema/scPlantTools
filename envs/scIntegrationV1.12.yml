# Stage 2 -- integration (run_integration.sh, export.sh) AND the doublet
# detection worker that the mapping stage shells out to
# (`doublets.env` in configs/pipeline_config.yaml, invoked as
#  python -m integration_scripts.doublet_model).
#
#   conda env create -f envs/scIntegrationV1.12.yml
#
# Captured 2026-07-21.  Python 3.12.11 / scvi-tools 1.5.0.post1 / pandas 2.3.2.
#
# pandas stays < 3 because scvi-tools does not support pandas 3.x.  That single
# constraint is the entire reason this env exists separately from
# scMappingV3.12 (pandas 3.0.3) rather than the two being merged.
#
# >>> numpy is pinned to 2.2.0 by hand, NOT to what the env reports. <<<
# This env's numpy *.dist-info is stale: importlib.metadata says 1.26.4 while
# numpy.__version__ says 2.2.0.  `conda env export` reads the metadata, so an
# uncorrected export rebuilds numpy 1.x -- a different major version, under
# torch 2.8 and scvi-tools 1.5.  shared/io.py::_package_version detects the
# disagreement at runtime and records the imported version for provenance;
# this file fixes it at the source.  Repairing the live env is still worthwhile.
#
# torch is the cu126 build -- integration needs a GPU node.
