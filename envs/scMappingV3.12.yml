# Stage 1 -- mapping, QC, filtering.  Activated by run_mapper.sh.
#
#   conda env create -f envs/scMappingV3.12.yml
#
# Captured from the live env on 2026-07-21 with `conda env export --no-builds`,
# then corrected (see envs/README.md).  Python 3.12.13 / numpy 2.4.6 / pandas 3.0.3.
#
# The pandas 3.x pin is what forces the three-env split: scvi-tools does not
# support pandas 3, so doublet detection and integration shell out to
# scIntegrationV1.12 rather than importing.  Do not relax it here to make one
# import work -- it would drag the whole stage back a major version.
#
# >>> THE piscem PINNED BELOW IS NOT THE ONE THE PIPELINE RUNS. <<<
#
# `piscem=0.21.1` here is the STOCK conda build, which silently truncates BD
# Rhapsody Enhanced Bead V2's 27bp split cell label to 9bp -- it keeps only the
# third of the three linker-separated blocks, reports success, and exits 0.
# ~384^3 possible cell labels collapse onto ~384 and nothing downstream can
# detect it after the fact.
#
# BD Rhapsody samples are therefore mapped with a PATCHED piscem at
# tools/bin/piscem, which run_mapper.sh puts ahead of this env on $PATH (before
# `simpleaf set-paths`, which caches resolved tool paths).  Rationale, patches
# and validation: piscem_bd_rhapsody/README.md.
#
# The trap: the patched binary reports the SAME version string, `piscem 0.21.1`.
# You cannot tell the two apart with `piscem --version` -- only by the geometry
# probe (stock says bc_len=9, patched says bc_len=27).  And tools/bin/ is
# gitignored, so a fresh clone has NO patched binary at all.
#
# After creating this env from this file, rebuild it:
#
#     bash tools/piscem-bd/build.sh     # ~15 min, needs network
#
# It vendors its own Rust toolchain under tools/piscem-bd/rust/ (never touches
# $HOME or the conda envs) and self-verifies bc_len=27 before installing.
# run_mapper.sh independently refuses to start if piscem reports anything other
# than 27 while a BD sample is in the sheet -- keep that guard, it is the only
# thing standing between a conda rebuild and silently corrupted output.
# 10x samples are unaffected either way; the patch keeps the single-piece path
# zero-copy.
#
# Included here and easy to lose in the noise:
#   * simpleaf 0.26.2 / alevin-fry 0.16.2 are conda packages in this env, so
#     activating it is the rest of the $PATH setup the mappers need.  simpleaf
#     links the same broken seq_geom_parser 1.1.0, but only forwards the
#     geometry to piscem, so patching piscem is sufficient.
#     NOTE piscem cannot read an index built by piscem 0.6.x -- see CLAUDE.md.
#     Rebuilding an index is an hours-long job.
#   * leidenalg + igraph + scikit-misc are invisible to import-scanning but sit
#     on QCPlotter.run()'s final-UMAP path, so a run without them dies AFTER
#     mapping and CellBender have already burned the time.
#   * cellbender 0.3.2 is present and DOES import on 3.12 -- but the copy in
#     this env is STOCK, i.e. it still carries the checkpoint weakref bug and
#     will crash ~150 epochs into a real run.  The pipeline is unaffected
#     because it shells out to cellBenderENV (via `cellbender.env` in
#     pipeline_config.yaml), which is patched.  If you ever run remove-background
#     from THIS env, apply the patch here too -- it applies cleanly to the 3.12
#     copy as well:
#       conda activate scMappingV3.12
#       patch -p0 -d "$CONDA_PREFIX/lib/python3.12/site-packages/cellbender/remove_background" \
#             < envs/cellbender-checkpoint-weakref.patch
#
# GPU: torch is the cu126 build.  Mapping needs a GPU node (CellBender is
# invoked with --cuda by default).
name: scMappingV3.12
