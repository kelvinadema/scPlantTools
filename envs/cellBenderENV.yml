# CellBender 0.3.2, run as a SUBPROCESS by the mapping stage -- never imported.
# Pointed at by `cellbender.env` in configs/pipeline_config.yaml, which wants
# the conda PREFIX (this directory), not the binary.
#
#   conda env create -f envs/cellBenderENV.yml
#   conda activate cellBenderENV
#   patch -p0 -d "$CONDA_PREFIX/lib/python3.10/site-packages/cellbender/remove_background" \
#         < envs/cellbender-checkpoint-weakref.patch
#
# >>> THE PATCH STEP IS NOT OPTIONAL. <<<
#
# Stock cellbender 0.3.2 crashes ~150 epochs into training with
#   TypeError: cannot pickle 'weakref.ReferenceType' object
# then takes the sample down with
#   AssertionError: Checkpoint file ckpt.tar.gz does not exist
# because its checkpoint writer pickles the live model object.  This is not
# fixed by changing Python or torch versions (CellBender #296, #395).  A plain
# `conda env create` from this file gives you the bug back; the patch is
# vendored next to this file precisely because an env rebuild silently drops it.
#
# The patch replaces the live-object saves with a state_dict save plus
# PyroOptim's own dill-backed .save().  Safe for how this pipeline calls
# CellBender (single-run remove-background never reconstructs 'model' from
# disk), but it WILL break CellBender's mid-training resume path, which needs a
# real nn.Module.  This pipeline never passes a resume flag, so that path is
# dead here -- if resume is ever wired in, revisit.
#
# Captured 2026-07-21.  Python 3.10.20, torch 2.13.0+cu130.
# (CLAUDE.md's env table still says torch 1.13.1 -- that is stale.)
