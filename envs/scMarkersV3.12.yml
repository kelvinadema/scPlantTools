# Marker identification.  Activated by run_markerID.sh; also referenced as
# `env:` in configs/annotation_config.yaml so annotation can call into it.
#
#   conda env create -f envs/scMarkersV3.12.yml
#
# Replaces scMarkersV3.9, which existed only because SEMITONES imports on
# Python 3.9 alone.  SEMITONES is dropped; LMD and CFMF are reimplemented in
# Python from their papers rather than shelled out to R, so this stage needs
# no R interpreter.
#
# Captured from the live env on 2026-07-21.  This file previously left versions
# to the solver; it is now fully pinned like the other four so a rebuild is
# reproducible rather than merely satisfiable.
# Python 3.12.13 / numpy 2.4.6 / pandas 2.3.3.
#
# >>> pandas < 3 is required, not preference. <<<
# Under pandas 3.0's copy-on-write, DataFrame.copy().values returns a read-only
# array, and hotspot 1.1.3 (April 2025, pre-pandas-3) calls np.fill_diagonal on
# exactly that in modules.py::compute_modules ->
#   ValueError: underlying array is read-only
# which kills create_modules(), i.e. the geneset output this stage exists for.
# Pinned here rather than patching the installed package so the constraint
# survives an env rebuild.  2.3.x also matches scIntegrationV1.12, which is what
# writes the h5ad files this stage reads.
#
# The two pip entries are the reason this env is not just scAnnotationV3.12:
#   hotspotsc 1.1.3  -- Hotspot, DeTomaso & Yosef 2021
#   cosg 1.0.4       -- COSG, Dai et al. 2022
