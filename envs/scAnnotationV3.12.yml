# Stage 3 -- annotation.  Activated by run_annotation.sh.
#
#   conda env create -f envs/scAnnotationV3.12.yml
#
# Captured 2026-07-21.  Python 3.12.3 / numpy 2.2.6 / pandas 2.3.2.
#
# This env carries the orthology toolchain, which is the part that is not
# pip-installable and the reason annotation cannot just borrow another env:
#   orthofinder 2.5.5, diamond 2.1.10, mcl 22.282, blast 2.5.0,
#   fastme 2.1.6.3, mafft 7.525, iqtree 3.0.1
# OrthoManager (ortho.py) shells out to `orthofinder`, so these must be on
# $PATH -- activating this env is what puts them there.
#
# CPU only; no torch.  OrthoFinder is the long pole, and its results are cached
# by _find_recent_result() unless --force is passed.
