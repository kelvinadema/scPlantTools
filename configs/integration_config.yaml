# yaml-language-server: $schema=./schemas/integration_config.schema.json

# Applied to every target below; a target that states the key wins.
defaults:
  tune: True
  # Train long enough for KL warmup to complete and the latent to settle, on
  # every scVI target and on both the tuning trials and the final fit. scvi's
  # default max_epochs is a cell-count heuristic (min(round(20000/n_obs*400),
  # 400)) that drops below the 400-epoch KL warmup default above ~20k cells, so
  # a large target would otherwise stop with kl_weight still ramping and the
  # latent under-regularized (scvi-tools #507: keep max_epochs > n_epochs_kl_warmup).
  # 80-epoch warmup completes at 40% of training with 120 epochs left to settle.
  # For a target much larger than this, prefer n_steps_kl_warmup (iteration-based)
  # in plan_kwargs instead. scArches targets also honour these on the query
  # fine-tune (refmapping merges the canonical weight_decay=0.0 into plan_kwargs).
  max_epochs: 200
  plan_kwargs:
    n_epochs_kl_warmup: 80
  check_val_every_n_epoch: 1

# NOT set here, but settable per target: `search_space:`. The autotune space is
# config-driven as of 2026-08-04, with a built-in default PER MODEL CLASS in
# integration/integrate.py::_SEARCH_SPACE_DEFAULTS (SCVI /
# JointEmbeddingSCVI / DRVI). A target states only the keys it changes; they are
# merged over that default per key. Values:
#
#   n_latent: [32, 64, 128]              tune.choice over the list
#   dispersion: ['gene-cell']            1-element list == pin, do not search
#   plan_lr: {loguniform: [1.0e-4, 1.0e-2]}   any ray sampler, single-key mapping
#   n_split_latent: null                 drop the key; scvi's own default, unnamed
#
# Only read when `tune: True` -- with tuning off the parameters come from
# `model_params:` instead. The defaults were narrowed on 2026-08-04 against the
# 30 tuned configs already in results/integration/scvi_tune_registry.json; the
# reasoning (unanimous values pinned, edge-pinned values EXTENDED rather than
# fixed) is in the block comment above _SEARCH_SPACE_DEFAULTS. Deliberately left
# out of this `defaults:` block: a search space belongs to a model class, not to
# every target in the file, and stating one here would apply a DRVI-shaped space
# to the JointEmbeddingSCVI targets above.

# ---------------------------------------------------------------------------
# THIS FILE IS THE BASE. It holds what the pipeline itself owns: the cohort
# groups, the `defaults:` block, the site paths, and the reference integrations
# other stages read.
#
# A thesis chapter's own targets are NOT here. They live in the notebooks repo
# beside the analysis that reads them, in a file that `extends:` this one:
#
#   notebooks/03-sc-vs-sn/configs/integration.yaml     Chapter 3
#   notebooks/05-Mt-resource/configs/integration.yaml  Chapter 5
#
# Run one of those with --icfg; the merged config is indistinguishable from a
# standalone file. A group or target name defined in both files is an ERROR,
# not an override -- see shared/targets.py::load_integration_config.
# ---------------------------------------------------------------------------

# Reusable sample lists. 
groups:
  tip: ['p1', 'p2', 'p3', 'rep1', 'rep2', 'rep3', 'rep4', 'BDTip2mm', 'BDTip10mm']
  induced_10x: ['pMock', 'pNOD', 'pBAP', 'B24H', 'B48H', 'B72H', 'B96H']
  induced_bd: ['BDMock', 'BDNod', 'SMu005', 'SMu006', 'SMu007', 'SMu008', 'SMu009', 'SMu010', 'SMu011', 'SMu012']
  induced_all: ['induced_10x', 'induced_bd']
  tip_induced_all: ['tip', 'induced_all']

  # The three UNTREATED susceptible-zone controls, one per (tech, prep)
  # combination the SZ cohort was collected under:
  #
  #   pMock    10xv3         2h_only      8,633 cells
  #   BDMock   bd_rhapsody   2h_only     26,913
  #   SMu008   bd_rhapsody   1h_2h_mix   32,096
  #
  # A group rather than three names written out at each use, because that
  # one-sample-per-combination property is the whole reason the set exists and is
  # invisible in a bare list. It also means `batch_key: {sz_mocks: [tech, prep]}`
  # is exactly per-sample correction here -- three samples, three levels -- but
  # states WHY the three differ rather than merely that they do, which is what
  # makes it extend correctly if a fourth control is ever added.
  #
  # These are members of induced_10x / induced_bd too. That is not a conflict:
  # groups are sample lists, and a sample may appear in several. It only becomes
  # one inside a single `batch_key:` mapping, where two entries claiming the same
  # sample is a hard error (parse_batch_key) precisely because precedence there
  # would be arbitrary.
  sz_mocks: ['pMock', 'BDMock', 'SMu008']

  # The tip reference plus those controls, and nothing else -- the bridge cohort.
  # Distinct from tip_induced_all, which carries every treated sample as well:
  # here the only non-tip cells are untreated, so tip and SZ can be put in one
  # latent space without a treatment effect in it.
  tip_sz_mocks: ['tip', 'sz_mocks']

  # -------------------------------------------------------------------------
  # THE NUCLEI ARM. Added 2026-08-15.
  #
  # `nMOCK`, `nNOD` and `nBAP` are 10x FACS-sorted NUCLEI; every other sample in
  # every group above is a protoplast. They are the only libraries that never
  # went through protoplasting -- a 1-2 h wounding treatment applied before
  # capture -- so they are the control for whether a treatment response is partly
  # a protoplasting artifact, and the only libraries in which root-hair
  # COMPOSITION can be contrasted at all (the protoplast arm's only 1 h
  # libraries, SMu005/SMu006, are both NF and have no 1 h mock).
  #
  # THEY DEFAULT TO `tech: 10xv3`, THE SAME AS THE 10x PROTOPLAST SAMPLES. So a
  # target carrying `batch_key: 'tech'` puts nuclei and 10x protoplast cells in
  # ONE batch level and applies no modality correction at all. Every target built
  # on these groups must name `sample_type` as well -- `['tech', 'sample_type']`
  # -- which is why each one below does.
  #
  # `N0h` is deliberately not a member. It is a second nuclei mock that has not
  # been through this chapter's QC, and adding it silently would change what
  # "the nuclei mock" means in a contrast.
  # -------------------------------------------------------------------------
  sz_nuclei: ['nMOCK', 'nNOD', 'nBAP']

  # Just the nuclei mock, so a MAPPED batch_key can give it its own entry without
  # overlapping `sz_mocks` -- parse_batch_key treats a sample claimed by two
  # mapping entries as a hard error, not a precedence question.
  nuc_mock: ['nMOCK']

  # `sz_mocks` plus the nuclei mock: the untreated cohort with both modalities in
  # it. This is the LABELLING reference -- it exists so that "cortex" means the
  # same thing in a nucleus and in a protoplast.
  sz_mocks_nuc: ['pMock', 'BDMock', 'SMu008', 'nMOCK']
  tip_sz_mocks_nuc: ['tip', 'sz_mocks_nuc']

  # The full perturbation cohort with the nuclei arm folded in: 17 protoplast
  # libraries plus mock/NF/BAP in nuclei. Balanced at 3 h -- every treatment
  # exists in both modalities -- and unbalanced everywhere else, since no
  # rhizobial timepoint has a nuclei counterpart.
  induced_all_nuc: ['induced_all', 'sz_nuclei']

IntegrateConfigs:
# TIP reference dataset
  MtTip:
    Samples: ['tip']
    covariates: ['mitochondrial_fraction_corrected_counts', 'chloroplast_fraction_corrected_counts', 'ribosomal_rna_fraction_corrected_counts']
    method: 'scVI'
    do_hvg: False
    tune: True
    model_class: 'JointEmbeddingSCVI'
    n_trials: 200
    artifact_key: 'filtered_manual_h5ad'

input_dir: /lustre/nobackup/WUR/PDB/adema026/scRNAseq/results/mapping
output_dir: /lustre/nobackup/WUR/PDB/adema026/scRNAseq/results/integration
