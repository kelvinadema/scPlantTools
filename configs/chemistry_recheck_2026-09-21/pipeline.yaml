configs:
  samples: /lustre/nobackup/WUR/PDB/adema026/scRNAseq/configs/chemistry_recheck_2026-09-21/rep4_samples.yaml
  mapping: /lustre/nobackup/WUR/PDB/adema026/scRNAseq/configs/chemistry_recheck_2026-09-21/mapping_config.yaml
  indexes: /lustre/nobackup/WUR/PDB/adema026/scRNAseq/configs/chemistry_recheck_2026-09-21/index_config.yaml
  technologies: /lustre/nobackup/WUR/PDB/adema026/scRNAseq/configs/chemistry_recheck_2026-09-21/technology_config.yaml
  qc: /lustre/nobackup/WUR/PDB/adema026/scRNAseq/configs/chemistry_recheck_2026-09-21/qc_config.yaml
  filter: /lustre/nobackup/WUR/PDB/adema026/scRNAseq/configs/chemistry_recheck_2026-09-21/filter_config.yaml
output_dir: /lustre/nobackup/WUR/PDB/adema026/scRNAseq/results/mapping_chemistry_recheck_2026-09-21
cellbender:
  env: /home/WUR/adema026/miniconda3/envs/cellBenderENV
  use_cuda: true
  learning_rate: 5e-5
  extra_args: []
doublets:
  env: /home/WUR/adema026/miniconda3/envs/scIntegrationV1.12
  use_cuda: true
  hvg_n_top_genes: 2000
  layer: corrected_counts
  n_latent: 10
  n_hidden: 128
  n_layers: 2
  random_state: 42
  min_cells: 200
  max_plausible_rate: 0.5
  tune: true
  n_trials: 20
  tune_metric: elbo_validation
  n_epochs_kl_warmup: 80
  scrublet:
    expected_doublet_rate: 0.06
    sim_doublet_ratio: 2.0
    n_prin_comps: 30
    min_cells: 50
  timeout: 7200
  extra_args: []
