# yaml-language-server: $schema=./schemas/sample_sheet.schema.json
#
# ---------------------------------------------------------------------------
# The design columns: tech, prep, treatment, time_h
#
# These describe the CELL, not the run. `integration/orchestrator.py` stamps
# each onto `.obs` at concatenation (never overwriting a column the mapping
# artifact already carries), so what is written here is what a model or a plot
# can group by later. Which of them are safe to *correct* on is a separate
# question -- see docs/decisions/batch-keys-and-confounds.md.
#
#   tech       Platform: 10xv3 | bd_rhapsody. Crossed with condition wherever
#              both platforms ran the same timepoints.
#
#   prep       Handling variant, set only where one exists. Currently the five
#              BD susceptible-zone NF/mock samples, where the 1h-post-
#              protoplasting variant is crossed with NF-vs-mock. Absent
#              elsewhere, which is correct: a cohort with one handling variant
#              has nothing to distinguish.
#
#   treatment  mock | none | NF | BAP | S_meliloti. `none` means untreated;
#              `mock` is the treated cohort's control.
#
#   time_h     HOURS SINCE TREATMENT APPLIED, as a number. Only interpretable
#              together with `treatment`: NF/BAP at 3 hpt and S. meliloti at
#              24 hpi share one numeric axis while being different timelines,
#              so never order cells on time_h ACROSS treatments.
#              * Untreated samples (`treatment: none`) carry NO time_h -- there
#                is no treatment to be hours after.
#              * Mock is `time_h: 0` by convention. Per the staggered-
#                inoculation design it was harvested alongside every timepoint,
#                so it is a control for all of them, not a t=0 baseline.
#
# `batch` is a free-form string naming the run. On this cohort it is one-to-one
# with condition, so it is NOT a safe correction target -- read the decisions
# doc above before naming it as a batch_key.
# ---------------------------------------------------------------------------
#
# Applied to every sample below; any sample may override any of these
# simply by stating the key itself.
defaults:
  fallback: ratio_global
  mapper: alevin
  mapping_config: default
  qc_filter: default
  qc_metrics: default
  sample_type: protoplast
  tech: 10xv3

