  # the library then called nMOCK carried 10.61% NIN+ cells at 0.786 mean CP10K
  # -- 120x pMock and above both pBAP and pNOD -- while the one called nBAP sat
  # at 0.591% / 0.028, level with BDMock (0.660%) and SMu008 (0.849%). Six
  # further tests agree, including pi(nNOD over nBAP)=0.721 on the NF axis
  # against 0.033 over nMOCK, and the gap survives depth-matching.
  #
  # The FASTQ paths move; the NAMES and their attributes stay. So `nMOCK` still
  # means the mock and every downstream `nMOCK` reference stays correct.
  # Confirmed as a swap (not a failed BAP treatment) by the user, 2026-08-21.
  # Full record: 05-Mt-resource/ch5-todo-2026-08-21.md section 6b.
