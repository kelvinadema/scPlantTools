# yaml-language-server: $schema=../../schemas/pipeline_config.schema.json
# Example only: copy to configs/local and edit paths before running.
configs:
  samples: configs/local/samples.yaml
  mapping: configs/local/mapping.yaml
  indexes: configs/local/indexes.yaml
  technologies: configs/local/technologies.yaml
  qc: configs/local/qc.yaml
  filter: configs/local/filter.yaml
output_dir: results/example/mapping
cellbender:
  env: null
  use_cuda: true
  learning_rate: 5e-5
  extra_args: []
doublets:
  env: null
  use_cuda: true
  hvg_n_top_genes: 2000
  layer: corrected_counts
  n_latent: 10
  n_hidden: 128
  n_layers: 2
  random_state: 42
  min_cells: 200
  max_plausible_rate: 0.5
  tune: true
  n_trials: 20
  tune_metric: elbo_validation
  n_epochs_kl_warmup: 80
  scrublet:
    expected_doublet_rate: 0.06
    sim_doublet_ratio: 2.0
    n_prin_comps: 30
    min_cells: 50
  timeout: 7200
  extra_args: []
