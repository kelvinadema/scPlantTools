name: Portable release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install source-check dependencies only
        run: python -m pip install 'pytest>=8,<9' 'PyYAML>=6,<7'
      - name: Verify public files, links, syntax and schemas
        run: python tools/check_release.py
      - name: Run portable tests
        run: python -m pytest tests/portable -q -ra
